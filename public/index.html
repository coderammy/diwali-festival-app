<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Diwali 🪔</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🪔 Happy Diwali Festival 🪔</h1>
  <p>Celebrate the Festival of Lights by sharing your wishes below!</p>

  <form id="commentForm">
    <input type="text" id="name" placeholder="Your name" required />
    <textarea id="message" placeholder="Your Diwali message..." required></textarea>
    <button type="submit">Post Wish</button>
  </form>

  <h2>✨ Wishes ✨</h2>
  <div id="comments"></div>

  <script src="script.js"></script>
</body>
</html>
